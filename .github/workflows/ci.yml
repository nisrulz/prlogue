name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting and modules
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go mod tidy -diff

      - name: Run unit tests and vet
        run: |
          go test -race ./...
          go vet ./...

      - name: Run end-to-end tests
        env:
          PRLOGUE_LIVE_TEST_PROVIDER: mock
        run: make test-live

      - name: Scan dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
