name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting and modules
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go mod tidy -diff

      - name: Run unit tests and vet
        run: |
          go test -race ./...
          go vet ./...

      - name: Run end-to-end tests
        env:
          PRLOGUE_LIVE_TEST_PROVIDER: mock
        run: make test-live

      - name: Scan dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
